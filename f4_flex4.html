<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="Author" content="Maulik" />
<title>Grid Layout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    color:white;
    font-family:Arial, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

main{
    width:850px;
    border:2px solid white;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:70px 220px 60px;
}

header,
nav,
footer{
    border:1px solid white;
    padding:10px;
}

.content{
    grid-column:1/3;
    border:1px solid white;
    position:relative;
}

/* Common style for both boxes */
.box1,
.box2{
    width:140px;
    height:80px;
    background:deepskyblue;

    position:absolute;

    display:flex;
    justify-content:center;
    align-items:center;
}
.box1{
    top:40px;
    left:250px;
    border:1px solid black;

}
.box2{
    top:80px;
    left:300px;
    border:1px solid black;
}

</style>
</head>

<body>
<main>

    <header>Logo</header>

    <nav>Links</nav>

    <section class="content">

        <section class="box1"></section>
        <section class="box2"></section>

    </section>

    <footer>Footer1</footer>
    <footer>Footer2</footer>

</main>
</body>
</html>
