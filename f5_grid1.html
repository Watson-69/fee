<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;


        }
        body{
            min-height: 100vh;
            font-family: 'Lucida Sans';
            font-size: 25px;
            background-color: rgb(0, 0, 0);
            color: rgb(20, 24, 24);
            background-image: "werk.png";
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;

        }
        .box{
            background-color: rgb(255, 0, 0);
            color: white;
            /* padding: 1rem; */
        }
        .fc{
            display: grid;
            gap:0.5rem;
            grid-template-columns: 150px 250px;
            grid-template-rows: repeat(3,150px);
            place-content: center;

        }
        @media(min-width:767px){
            .fc{
                grid-template-columns: repeat(3,200px);
                grid-template-rows: repeat(2,200px);
            }
        }
         @media(min-width:1024px){
            .fc{
                grid-template-columns: repeat(4,250px);
                grid-template-rows: repeat(2,250px);
            }
        }
        #m6{
            grid-column: 2/-1;
        }

    </style>
</head>
<body>
    <section class="box" style="height:25px; padding: 53px; text-align: left;">
        HEADER/NAVBAR
    </section>
    <section 
    class=" box fc" 
    style="height: 80vh; background-color: white"
    >
        <main class="box" id="m1"> content-1</main>
        <main class="box"  id="m1"> content-2</main>
        <main class="box"  id="m1"> content-3</main>
        <main class="box"  id="m1"> content-4</main>
        <main class="box"  id="m1"> content-5</main>
        <main class="box"  id="m1"> content-6</main>
    </section>
    <section class="box" style="position: absolute; bottom: 0; left:0; width: 100%; height:25px; padding:53px; text-align:left;">
        FOOTER
    </section>
</body>
</html>
