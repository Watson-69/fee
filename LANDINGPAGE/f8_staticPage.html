<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            min-height: 100dvh;
            background-image: url(LAYOUT.jpg);
            background-size: cover;
            background-position: center;
        }
        .p{
            padding: 0.5rem;
        }
        section{
            width: 100%;
        }
        .box{
            width: 100%;
            height: 7rem;
            border: 1px solid whitesmoke;
            border-radius: 5px;
            overflow: hidden;
        }
        .card{
            padding: 0.5rem;
            /* height: 7rem;
            border: 1px solid whitesmoke;
            border-radius: 5px;
            overflow: hidden; */
            box-shadow: 0.3px 5px rgba(0,0,0,0.3);
            border: 1px solid rgba(255 ,255 ,255, 0.5);
            background-color: hsla(215,100%,80%,0.3);
            backdrop-filter: blur(5px) ;
            color: whitesmoke;
            max-width: 500px;
        }
        .fc1{
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }
        .fc2{
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 0.5rem; 
        }
        @media  screen and(min-width: 767px) {
            #s1,
             #s2{
                width: 80%;
             }  
        }
        @media  screen and(min-width: 1024px) {
            #s1,
             #s2{
                width: 70%;
             }
        }   
    </style>
    <body>
        <section class="p fc1">
            <section class="p fc2" id="s1">
                <div class="p box card">Box1</div>
            </section>

            <section class="fc2">
                <div class="p box card">Box2</div>
                <div class="p box card">Box3</div>
                <div class="p box card">Box4</div>
            </section>
        </section>
        
        <script src="" async defer></script>
    </body>
</html>
