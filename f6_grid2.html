    <!DOCTYPE html>
    <html lang='en'>
    <head>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <title>Page Title</title>
        <link rel='stylesheet' href='main.css'>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;


            }
            body{
                min-height: 100vh;
                font-family: 'Lucida Sans';
                font-size: 25px;
                background-color: rgb(0, 0, 0);
                color: rgb(20, 24, 24);
            }
            .box{
                background-color: rgb(0, 89, 255);
                color: white;
                /* padding: 1rem; */
            }
            .fc{
                display: grid;
                gap:0.5rem;
                grid-template-columns:repeat(3,150px);
                grid-template-rows: repeat(3,150px);
                place-content: center;

            }
            @media(min-width:767px){
                .fc{
                    grid-template-columns: minmax(175px,225px) minmax(225px,275px) minmax(175px,225px);
                    grid-template-rows: repeat(3,175px);
                }
            }
            @media(min-width:1024px){
                .fc{
                    grid-template-columns: minmax(250px,350px) minmax(300px,400px) minmax(250px,350px);
                    grid-template-rows: repeat(3,175px);
                }
            }
            #m1{
                grid-column-start: 1;
                grid-column-end: 3;
                grid-row-start: 1;
                grid-row-end: 2;
            }
            #m2{
                grid-column-start: 3;
                grid-column-end: 4;
                grid-row-start: 1;
                grid-row-end: 3;
            }
            #m3{
                grid-column-start: 1;
                grid-column-end: 2;
                grid-row-start: 2;
                grid-row-end:4;
            }
            #m5{
                grid-column-start: 2;
                grid-column-end: 4;
                grid-row-start: 3;


                
                grid-row-end:4;
            }

        </style>








    </head>
    <body>
        <section class="box" style="height:25px; padding: 53px; text-align: left;">
            HEADER/NAVBAR
        </section>
        <section 
        class=" box fc" 
        style="height: 80vh; background-color: white"
        >
            <main class="box" id="m1"> content-1</main>
            <main class="box"  id="m2"> content-2</main>
            <main class="box"  id="m3"> content-3</main>
            <main class="box"  id="m4"> content-4</main>
            <main class="box"  id="m5"> content-5</main>
            <!-- <main class="box"  id="m6"> content-6</main> -->
        </section>
        <section class="box" style="position: absolute; bottom: 0; left:0; width: 100%; height:25px; padding:53px; text-align:left;">
            FOOTER
        </section>
    </body>
    </html>
