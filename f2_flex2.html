<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="Author" content="Keshav Gupta" />
<title>Grid Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    color:white;
    font-family:Arial, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

main{
    width:850px;
    border:2px solid white;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows: 70px 220px 60px;
}


nav,
aside,
section,
footer{
    border:1px solid white;
    padding:10px;
}

section{
    grid-column:1/3;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
}

article{
    width:190px;
    height:90px;
    background:deepskyblue;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:14px;
    font-weight:bold;
}
</style>

</head>
<body>

<main>


    <aside>Logo</aside>

    <nav>Links</nav>

    <section>

        <article>
            Bigger Rectanglular Box
        </article>

        <article>
            Bigger Rectanglular Box
        </article>

    </section>

    <footer>Footer1</footer>
    <footer>Footer2</footer>

</main>
</body>
</html>
